<!doctype html><meta charset="utf-8"><button id="run">运行移动视角测试</button><pre id="result"></pre><script src="/three.min.js"></script><script src="/map-surfaces.js"></script><script>
const renderer=new THREE.WebGLRenderer({antialias:false}),target=new THREE.WebGLRenderTarget(256,256);renderer.setSize(256,256);document.body.append(renderer.domElement);const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(74,1,.05,500),g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute([-2,-1,-60,2,-1,-56,2,3,-56,-2,-1,-60,2,3,-56,-2,3,-60],3));
const vertex='varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}';
function material(smooth){return new THREE.ShaderMaterial({side:THREE.DoubleSide,extensions:{derivatives:true},vertexShader:vertex,fragmentShader:'varying vec3 p;void main(){vec3 n=abs(normalize(cross(dFdx(p),dFdy(p))));'+(smooth?'vec3 faceNormal=n;'+MapSurfaces.projectionWeightsGLSL+'gl_FragColor=vec4(projectionWeights.x,0.0,projectionWeights.z,1.0);':'gl_FragColor=vec4(n.x>n.z?1.0:0.0,0.0,n.x>n.z?0.0:1.0,1.0);')+'}'});}
const mesh=new THREE.Mesh(g,material(false));scene.add(mesh);const pixels=new Uint8Array(256*256*4);
function run(smooth){mesh.material.dispose();mesh.material=material(smooth);const ratios=[];for(let i=0;i<24;i++){const a=i/24*Math.PI*2;cam.position.set(Math.sin(a)*.6,1+Math.cos(a)*.1,-53+Math.cos(a)*.4);cam.lookAt(0,1,-58);renderer.setRenderTarget(target);renderer.setClearColor(0,0);renderer.clear();renderer.render(scene,cam);renderer.readRenderTargetPixels(target,0,0,256,256,pixels);let r=0,n=0;for(let k=0;k<pixels.length;k+=4)if(pixels[k+3]){r+=pixels[k]/255;n++;}ratios.push(r/n);}return {min:Math.min(...ratios),max:Math.max(...ratios),range:Math.max(...ratios)-Math.min(...ratios)};}
document.querySelector('#run').onclick=()=>{const old=run(false),fixed=run(true);document.querySelector('#result').textContent=JSON.stringify({passed:fixed.range<.005,views:24,old,fixed},null,2);renderer.setRenderTarget(null);renderer.render(scene,cam);};</script>
