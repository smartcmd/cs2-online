<!doctype html><meta charset="utf-8"><title>Sky environment regression</title><pre id="result">Checking sky capture…</pre><script src="/three.min.js"></script><script src="/lighting.js"></script><script>
(async()=>{const T=THREE,r=new T.WebGLRenderer({antialias:false});r.setSize(128,128);document.body.appendChild(r.domElement);const scene=new T.Scene(),view=new T.Scene(),meta=await(await fetch('/maps/dust2.json')).json(),loaded=await MapLighting.installSky(T,r,scene,view,meta);scene.remove(loaded.sky);const old=new T.Scene();old.add(new T.Mesh(new T.SphereGeometry(350,16,8),new T.ShaderMaterial({side:T.BackSide,vertexShader:'void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'void main(){gl_FragColor=vec4(.3,.5,.8,1.);}'})));const p=new T.PMREMGenerator(r),previous=p.fromScene(old,0);p.dispose();const camera=new T.PerspectiveCamera(50,1,.1,10);camera.position.z=3;const mat=new T.MeshStandardMaterial({metalness:1,roughness:.3});scene.add(new T.Mesh(new T.SphereGeometry(.8,32,16),mat));const target=new T.WebGLRenderTarget(128,128),pixels=new Uint8Array(128*128*4);const means=[];for(const env of [previous.texture,loaded.environment.texture]){scene.environment=env;r.setRenderTarget(target);r.render(scene,camera);r.readRenderTargetPixels(target,0,0,128,128,pixels);let total=0;for(let y=40;y<88;y++)for(let x=40;x<88;x++)for(let c=0;c<3;c++)total+=pixels[(y*128+x)*4+c];means.push(total/(48*48*3));}r.setRenderTarget(null);r.render(scene,camera);document.getElementById('result').textContent=JSON.stringify({pass:means[0]<1&&means[1]>10&&means[1]<245&&loaded.environment.texture.encoding===T.RGBEEncoding,previousMean:means[0],currentMean:means[1],encoding:loaded.environment.texture.encoding},null,2);})().catch(e=>document.getElementById('result').textContent='FAIL '+e.stack);
</script>
